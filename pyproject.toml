[project]
name = "telegram-bot"
version = "0.1.0"
description = "Telegram bot template"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "bs4>=0.0.2",
    "lxml>=6.1.3",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
