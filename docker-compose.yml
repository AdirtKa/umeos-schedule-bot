services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${BOT_DATA_DIR:-./data}:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
